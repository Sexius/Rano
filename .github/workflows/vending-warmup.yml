name: Render Keep Alive

on:
  schedule:
    - cron: '*/14 * * * *'
  workflow_dispatch:

concurrency:
  group: render-keepalive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping lightweight health endpoint
        env:
          PING_URL: 'https://rano.onrender.com/api/ping'
        run: |
          echo "Pinging Render at $(date)"
          curl -fsS "$PING_URL"
